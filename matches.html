<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Kraft - Recipes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f6ef;
            color: #26352a;
        }

        header {
            background: #ffffff;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e2d8;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #315c3b;
        }

        .logo span {
            margin-right: 6px;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #37433a;
            font-size: 15px;
        }

        nav a:hover {
            color: #315c3b;
        }

        .page {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 40px 0 80px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px;
            color: #294b32;
        }

        .page-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .selected-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #e5e2d8;
        }

        .selected-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .selected-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ingredient-pill {
            background: #e7f1e6;
            color: #315c3b;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 13px;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        .filter-btn {
            border: 1px solid #b8c9b7;
            background: white;
            color: #315c3b;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #315c3b;
            color: white;
        }

        .recipe-count {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .recipe-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e4e2d9;
            transition: 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .recipe-image {
            height: 145px;
            background: #eaf0e5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
        }

        .recipe-content {
            padding: 18px;
        }

        .recipe-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .recipe-name {
            font-size: 20px;
            font-weight: bold;
            color: #294b32;
            margin: 0;
        }

        .match-badge {
            background: #e5f3e4;
            color: #2f6837;
            padding: 6px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .recipe-info {
            display: flex;
            gap: 15px;
            color: #777;
            font-size: 13px;
            margin: 12px 0;
        }

        .meal {
            color: #315c3b;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .ingredients-info {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .view-btn {
            display: block;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #315c3b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .view-btn:hover {
            background: #24482d;
        }

        .no-results {
            display: none;
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 18px;
        }

        .no-results-icon {
            font-size: 50px;
        }

        .no-results h2 {
            color: #294b32;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 20px;
            border-radius: 10px;
            background: #315c3b;
            color: white;
            text-decoration: none;
        }

        .error-box {
            background: #fff1f1;
            border: 1px solid #e5aaaa;
            color: #8b3030;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .recipe-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 12px;
            }

            .page {
                width: 92%;
                padding-top: 25px;
            }

            .page-title {
                font-size: 27px;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
            }

            .recipe-image {
                height: 160px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span>👨‍🍳</span>
        Kitchen Kraft
    </div>

    <nav>
        <a href="home.html">Home</a>

        <a href="ingredient.html">My Kitchen</a>

        <a href="matches.html">Recipes</a>

        <!-- CORRECT FILE NAME -->
        <a href="favorite.html">Favorites</a>

        <a href="index.html" onclick="logoutUser()">Logout</a>
    </nav>

</header>


<div class="page">

    <h1 class="page-title">
        Recipes You Can Make 🍴
    </h1>

    <p class="page-subtitle">
        Based on the ingredients available in your kitchen
    </p>


    <div class="selected-box">

        <div class="selected-title">
            🧺 Your Ingredients
        </div>

        <div
            id="selectedIngredients"
            class="selected-ingredients">
        </div>

    </div>


    <div class="filters">

        <button
            class="filter-btn active"
            type="button"
            onclick="filterRecipes('all', this)">
            All
        </button>

        <button
            class="filter-btn"
            type="button"
            onclick="filterRecipes('80', this)">
            80%+
        </button>

        <button
            class="filter-btn"
            type="button"
            onclick="filterRecipes('50', this)">
            50%+
        </button>

    </div>


    <div
        class="recipe-count"
        id="recipeCount">
        Loading recipes...
    </div>


    <div
        id="recipeGrid"
        class="recipe-grid">
    </div>


    <div
        id="noResults"
        class="no-results">

        <div class="no-results-icon">
            🍳
        </div>

        <h2>No recipes found</h2>

        <p>
            Try selecting some more ingredients.
        </p>

        <a
            href="ingredient.html"
            class="back-btn">
            Choose Ingredients
        </a>

    </div>

</div>


<!-- =========================================
     LOAD RECIPE DATA FIRST
========================================= -->

<script src="recipeData.js"></script>

<!-- COMMON JAVASCRIPT -->
<script src="script.js"></script>


<script>

    let allRecipes = [];
    let currentFilter = "all";


    /* =========================================
       NORMALIZE INGREDIENT NAMES
    ========================================= */

    function normalizeIngredient(name) {

        if (!name) {
            return "";
        }

        name = String(name)
            .toLowerCase()
            .trim();

        const aliases = {
            "ragi": "ragi flour",
            "prawn": "prawns"
        };

        return aliases[name] || name;
    }


    /* =========================================
       GET SELECTED INGREDIENTS
    ========================================= */

    function getSelectedIngredients() {

        const saved =
            localStorage.getItem("selectedIngredients");

        if (!saved) {
            return [];
        }

        try {

            const data = JSON.parse(saved);

            return Array.isArray(data) ? data : [];

        } catch (error) {

            return [];

        }
    }


    /* =========================================
       CALCULATE MATCH
    ========================================= */

    function calculateMatch(recipe) {

        const selected =
            getSelectedIngredients()
                .map(normalizeIngredient);

        if (!recipe.ingredients ||
            recipe.ingredients.length === 0) {

            return 0;
        }

        let matched = 0;

        recipe.ingredients.forEach(function(item) {

            let ingredientName;

            /*
             Recipe ingredients are expected
             to be arrays like:

             ["Tomato", "2"]
            */

            if (Array.isArray(item)) {

                ingredientName = item[0];

            } else {

                ingredientName = item;

            }

            ingredientName =
                normalizeIngredient(ingredientName);


            if (selected.includes(ingredientName)) {
                matched++;
            }

        });


        return Math.round(
            (matched / recipe.ingredients.length) * 100
        );
    }


    /* =========================================
       PREPARE RECIPES
    ========================================= */

    function prepareRecipes() {

        allRecipes = [];


        if (
            typeof recipeData === "undefined" ||
            !recipeData
        ) {

            showError(
                "Recipe data could not be loaded."
            );

            return false;
        }


        for (const id in recipeData) {

            const recipe = recipeData[id];

            if (!recipe) {
                continue;
            }

            const match =
                calculateMatch(recipe);


            allRecipes.push({

                id: id,

                ...recipe,

                match: match

            });

        }


        allRecipes.sort(
            function(a, b) {

                return b.match - a.match;

            }
        );


        return true;
    }


    /* =========================================
       SHOW ERROR
    ========================================= */

    function showError(message) {

        const grid =
            document.getElementById("recipeGrid");

        const count =
            document.getElementById("recipeCount");


        count.textContent =
            "Unable to load recipes";


        grid.innerHTML = `

            <div class="error-box">

                <h2>⚠️ Recipe loading problem</h2>

                <p>
                    ${message}
                </p>

                <p style="margin-top:10px;">
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }


    /* =========================================
       DISPLAY SELECTED INGREDIENTS
    ========================================= */

    function displaySelectedIngredients() {

        const container =
            document.getElementById(
                "selectedIngredients"
            );


        const selected =
            getSelectedIngredients();


        container.innerHTML = "";


        if (selected.length === 0) {

            container.innerHTML = `

                <span class="ingredient-pill">
                    No ingredients selected
                </span>

            `;

            return;
        }


        selected.forEach(function(ingredient) {

            const pill =
                document.createElement("span");

            pill.className =
                "ingredient-pill";

            pill.textContent =
                ingredient;

            container.appendChild(pill);

        });

    }


    /* =========================================
       DISPLAY RECIPES
    ========================================= */

    function displayRecipes() {

        const grid =
            document.getElementById("recipeGrid");

        const noResults =
            document.getElementById("noResults");

        const count =
            document.getElementById("recipeCount");


        grid.innerHTML = "";


        let filteredRecipes =
            allRecipes.filter(function(recipe) {

                if (currentFilter === "80") {

                    return recipe.match >= 80;

                }

                if (currentFilter === "50") {

                    return recipe.match >= 50;

                }

                return true;

            });


        count.textContent =
            filteredRecipes.length +
            " recipes found";


        if (filteredRecipes.length === 0) {

            noResults.style.display =
                "block";

            return;

        }


        noResults.style.display =
            "none";


        filteredRecipes.forEach(function(recipe) {

            const card =
                document.createElement("div");

            card.className =
                "recipe-card";


            let ingredientNames = "";


            if (Array.isArray(recipe.ingredients)) {

                ingredientNames =
                    recipe.ingredients
                        .slice(0, 4)
                        .map(function(item) {

                            if (Array.isArray(item)) {
                                return item[0];
                            }

                            return item;

                        })
                        .join(", ");

            }


            card.innerHTML = `

                <div class="recipe-image">
                    ${recipe.emoji || "🍴"}
                </div>


                <div class="recipe-content">

                    <div class="recipe-top">

                        <h2 class="recipe-name">
                            ${recipe.name || "Recipe"}
                        </h2>

                        <span class="match-badge">
                            ${recipe.match}% Match
                        </span>

                    </div>


                    <div class="recipe-info">

                        <span>
                            ⏱ ${recipe.time || "20 min"}
                        </span>

                        <span>
                            👥 ${recipe.servings || "2"}
                        </span>

                    </div>


                    <div class="meal">
                        ${recipe.meal || ""}
                    </div>


                    <div class="ingredients-info">

                        <strong>Ingredients:</strong>

                        ${ingredientNames}

                    </div>


                    <a
                        href="recipe.html?recipe=${recipe.id}"
                        class="view-btn">

                        VIEW RECIPE

                    </a>

                </div>

            `;


            grid.appendChild(card);

        });

    }


    /* =========================================
       FILTER RECIPES
    ========================================= */

    function filterRecipes(filter, button) {

        currentFilter = filter;


        document
            .querySelectorAll(".filter-btn")
            .forEach(function(btn) {

                btn.classList.remove("active");

            });


        button.classList.add("active");


        displayRecipes();

    }


    /* =========================================
       START PAGE
    ========================================= */

    function startRecipesPage() {

        displaySelectedIngredients();


        if (!prepareRecipes()) {
            return;
        }


        displayRecipes();

    }


    /*
       recipeData.js is loaded before this script,
       so DOMContentLoaded is safe.
    */

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            startRecipesPage
        );

    } else {

        startRecipesPage();

    }

</script>

</body>
</html>
