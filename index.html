<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Kraft - Login</title>

    <link rel="stylesheet" href="CSS/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at 10% 20%, #dcebd2 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, #d8e8ce 0%, transparent 25%),
                #edf2e7;

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px;
        }


        /* =================================
           COOKBOOK
        ================================= */

        .cookbook {
            width: min(1100px, 96vw);
            min-height: 650px;

            position: relative;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: #f8f5e9;

            border: 12px solid #1d543b;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 25px 55px rgba(27, 65, 45, 0.25),
                inset 0 0 0 2px #86a77d;
        }


        /* BOOK COVER */

        .cookbook::before {
            content: "";

            position: absolute;

            inset: 7px;

            border: 1px solid rgba(255,255,255,0.6);

            border-radius: 12px;

            pointer-events: none;

            z-index: 10;
        }


        /* BOOK SPINE */

        .book-spine {
            position: absolute;

            left: 50%;
            top: 0;
            bottom: 0;

            width: 4px;

            background:
                linear-gradient(
                    to right,
                    #c9c2ad,
                    #fffdf4,
                    #c9c2ad
                );

            transform: translateX(-50%);

            z-index: 8;
        }


        /* =================================
           LEFT PAGE
        ================================= */

        .book-left {
            position: relative;

            min-height: 650px;

            padding: 55px 50px;

            background:
                linear-gradient(
                    90deg,
                    #eee9d9,
                    #fffdf4 12%,
                    #fffdf7 90%,
                    #eee9d9
                );

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            overflow: hidden;
        }


        /* PAGE CORNERS */

        .page-leaf {
            position: absolute;

            color: #477b55;

            font-size: 42px;

            opacity: 0.75;
        }

        .leaf-top-left {
            top: 25px;
            left: 25px;
            transform: rotate(-25deg);
        }

        .leaf-top-right {
            top: 35px;
            right: 25px;
            transform: rotate(25deg);
        }

        .leaf-bottom-left {
            bottom: 30px;
            left: 25px;
            transform: rotate(-45deg);
        }

        .leaf-bottom-right {
            bottom: 25px;
            right: 30px;
            transform: rotate(35deg);
        }


        /* CHEF ICON */

        .chef-icon {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #e2ecd9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;

            margin-bottom: 18px;

            box-shadow:
                0 7px 18px rgba(46, 88, 57, 0.12);
        }


        /* LOGO */

        .brand-name {
            margin: 0;

            color: #145737;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-size: clamp(58px, 7vw, 88px);

            font-weight: 700;

            line-height: 0.85;

            letter-spacing: -3px;

            transform: rotate(-2deg);

            text-shadow:
                1px 2px 0 #d7e3cd;
        }


        .brand-name span {
            display: block;

            font-size: 0.8em;

            margin-left: 65px;
        }


        .tagline {
            margin-top: 25px;

            color: #315c43;

            font-family: Georgia, serif;

            font-size: 16px;

            letter-spacing: 1px;
        }


        .little-line {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 22px 0;

            color: #36714b;
        }

        .little-line::before,
        .little-line::after {
            content: "";

            width: 55px;
            height: 1px;

            background: #568160;
        }


        .brand-message {
            color: #477054;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-size: 28px;

            line-height: 1.2;

            transform: rotate(-2deg);

            max-width: 280px;
        }


        /* KITCHEN DECOR */

        .kitchen-decor {
            position: absolute;

            bottom: 20px;
            left: 30px;

            display: flex;
            align-items: flex-end;

            gap: 8px;

            font-size: 42px;
        }

        .kitchen-decor span:nth-child(2) {
            font-size: 55px;
        }

        .kitchen-decor span:nth-child(3) {
            font-size: 35px;
        }


        /* =================================
           RIGHT PAGE
        ================================= */

        .book-right {
            position: relative;

            min-height: 650px;

            padding: 65px 70px;

            background:
                linear-gradient(
                    90deg,
                    #f0ecdf,
                    #fffdf7 10%,
                    #fffdf7 90%,
                    #eee9d9
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        .book-right h1 {
            margin: 0;

            text-align: center;

            color: #165b3b;

            font-family: Georgia, serif;

            font-size: 42px;
        }


        .book-right-subtitle {
            text-align: center;

            color: #6b796f;

            font-size: 14px;

            line-height: 1.6;

            margin: 10px auto 30px;

            max-width: 340px;
        }


        /* FORM */

        .input-box {
            height: 58px;

            border: 1.5px solid #9eaf9a;

            border-radius: 30px;

            background: rgba(255,255,255,0.55);

            display: flex;
            align-items: center;

            margin-bottom: 16px;

            padding: 0 20px;

            transition: 0.2s;
        }


        .input-box:focus-within {
            border-color: #246a46;

            box-shadow:
                0 0 0 3px rgba(36,106,70,0.09);
        }


        .input-icon {
            font-size: 19px;

            color: #246a46;

            margin-right: 13px;
        }


        .input-box input {
            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 15px;

            color: #244637;
        }


        .input-box input::placeholder {
            color: #7d897f;
        }


        /* OPTIONS */

        .login-options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 2px 5px 25px;

            font-size: 13px;

            color: #68766d;
        }


        .login-options label {
            display: flex;

            align-items: center;

            gap: 6px;
        }


        .login-options input {
            accent-color: #246a46;
        }


        .login-options a {
            color: #165b3b;

            text-decoration: none;

            font-weight: 600;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            height: 56px;

            border: none;

            border-radius: 30px;

            background: #236b45;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 8px 18px rgba(35,107,69,0.2);
        }


        .login-button:hover {
            background: #174f34;

            transform: translateY(-2px);
        }


        /* SIGN UP */

        .signup-text {
            text-align: center;

            color: #6e7972;

            font-size: 14px;

            margin-top: 25px;
        }


        .signup-link {
            color: #165b3b;

            font-weight: bold;

            text-decoration: none;
        }


        .signup-link:hover {
            text-decoration: underline;
        }


        /* BOOKMARK */

        .bookmark {
            position: absolute;

            bottom: -1px;
            left: 50%;

            width: 32px;
            height: 75px;

            background: #226a45;

            z-index: 20;

            transform: translateX(-50%);

            clip-path: polygon(
                0 0,
                100% 0,
                100% 100%,
                50% 82%,
                0 100%
            );
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .cookbook {
                grid-template-columns: 1fr;

                min-height: auto;

                border-width: 7px;
            }

            .book-spine {
                display: none;
            }

            .book-left {
                min-height: 390px;

                padding: 35px 25px;
            }

            .book-right {
                min-height: 500px;

                padding: 40px 25px;
            }

            .brand-name {
                font-size: 60px;
            }

            .brand-name span {
                margin-left: 35px;
            }

            .bookmark {
                display: none;
            }

            .kitchen-decor {
                bottom: 8px;
            }
        }

    </style>
</head>


<body>


<div class="cookbook">

    <div class="book-spine"></div>

    <div class="bookmark"></div>


    <!-- =================================
         LEFT BOOK PAGE
    ================================= -->

    <section class="book-left">

        <div class="page-leaf leaf-top-left">
            🌿
        </div>

        <div class="page-leaf leaf-top-right">
            🍃
        </div>

        <div class="page-leaf leaf-bottom-left">
            🌿
        </div>

        <div class="page-leaf leaf-bottom-right">
            🍃
        </div>


        <div class="chef-icon">
            👨‍🍳
        </div>


        <h2 class="brand-name">
            Kitchen
            <span>Kraft</span>
        </h2>


        <p class="tagline">
            Cook More With What You Have.
        </p>


        <div class="little-line">
            ♥
        </div>


        <div class="brand-message">
            Good Food<br>
            Brings People Together
        </div>


        <div class="kitchen-decor">

            <span>🥬</span>
            <span>🥄</span>
            <span>🌿</span>
            <span>🧄</span>

        </div>

    </section>



    <!-- =================================
         RIGHT BOOK PAGE
    ================================= -->

    <section class="book-right">

        <h1>
            Welcome Back!
        </h1>


        <p class="book-right-subtitle">
            Log in to your Kitchen Kraft account<br>
            and continue your cooking journey.
        </p>


        <div class="input-box">

            <span class="input-icon">
                ✉
            </span>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
            >

        </div>


        <div class="input-box">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>


        <div class="login-options">

            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">
                Forgot Password?
            </a>

        </div>


        <!-- KEEPING YOUR EXISTING FUNCTION -->

        <button
            class="login-button"
            type="button"
            onclick="loginUser()"
        >
            Log In&nbsp;&nbsp; →
        </button>


        <!-- KEEPING YOUR EXISTING SIGN UP FLOW -->

        <p class="signup-text">

            Don't have an account?

            <a
                href="./signup.html"
                class="signup-link"
            >
                Sign Up
            </a>

        </p>

    </section>

</div>


<script src="script.js"></script>

</body>

</html>
